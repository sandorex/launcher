[package]
name = "simple-desktop-launcher-thingy"
version = "0.1.0"
edition = "2024"

[dependencies]
configparser = "3.2.0"
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
